<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two screens, one sea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #fffaf0;
    --ink-soft: rgba(255, 250, 240, 0.8);
    --glow: rgba(8, 30, 70, 0.45);
    --bg: #0a1630;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #050c1c; }
  }
  :root[data-theme="dark"] { --bg: #050c1c; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
  body {
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Nunito", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #scene:active { cursor: grabbing; }

  .clock {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 22px) 16px 0;
    text-align: center; pointer-events: none;
    text-shadow: 0 2px 22px var(--glow), 0 0 2px rgba(0, 0, 0, 0.12);
  }
  .time { font-size: clamp(2.3rem, 9vw, 3.7rem); font-weight: 500; line-height: 1.05; letter-spacing: 0.01em; font-variant-numeric: tabular-nums; }
  .date { margin-top: 6px; font-size: clamp(0.95rem, 3.4vw, 1.2rem); font-weight: 400; color: var(--ink-soft); }

  .controls {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    text-shadow: 0 1px 12px var(--glow);
  }
  .hint { font-size: 0.9rem; color: var(--ink-soft); transition: opacity 0.9s ease; text-align: center; }
  .hint.gone { opacity: 0; }
  .bar { width: min(94vw, 540px); display: flex; align-items: flex-start; gap: 14px; }
  .play {
    flex: none; width: 40px; height: 40px; border-radius: 50%; padding: 0;
    border: 1px solid rgba(255, 250, 240, 0.55); background: rgba(255, 250, 240, 0.16); color: var(--ink);
    display: grid; place-items: center; cursor: pointer;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .play:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .play .i-pause { display: none; }
  .live {
    flex: none; height: 40px; padding: 0 14px; border-radius: 20px; font: inherit; font-size: 0.85rem; text-shadow: none;
    border: 1px solid rgba(255, 250, 240, 0.55); background: rgba(255, 250, 240, 0.16); color: var(--ink);
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 250, 240, 0.55); }
  .live[aria-pressed="true"] { background: rgba(255, 250, 240, 0.92); color: #0b1a38; }
  .live[aria-pressed="true"]::before { background: #e5484d; }
  .live:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .play[aria-pressed="true"] .i-play { display: none; }
  .play[aria-pressed="true"] .i-pause { display: block; }
  .rail { flex: 1; min-width: 0; }
  .ticks { position: relative; height: 18px; margin-top: -4px; font-size: 0.78rem; color: var(--ink-soft); }
  .ticks span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
  .ticks span:first-child { transform: none; }
  .ticks span:last-child { transform: translateX(-100%); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 40px; background: transparent; margin: 0; cursor: pointer; display: block; }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 8px; background: var(--sky, rgba(255,250,240,.4)); box-shadow: 0 0 0 1px rgba(255, 250, 240, 0.4); }
  input[type=range]::-moz-range-track { height: 8px; border-radius: 8px; background: var(--sky, rgba(255,250,240,.4)); box-shadow: 0 0 0 1px rgba(255, 250, 240, 0.4); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -8px; border-radius: 50%; background: var(--ink); border: 0; box-shadow: 0 2px 12px rgba(8, 30, 70, 0.55); }
  input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); border: 0; box-shadow: 0 2px 12px rgba(8, 30, 70, 0.55); }
  input[type=range]:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 8px; }

  .fallback { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 32px; text-align: center; }
  .back-link {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 20px); left: 20px; z-index: 50;
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 9999px;
    background: rgba(255, 250, 240, 0.14); border: 1px solid rgba(255, 250, 240, 0.28); color: var(--ink);
    font-size: 0.85rem; font-weight: 500; text-decoration: none; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: background 0.2s, transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
  }
  .back-link:hover { background: rgba(255, 250, 240, 0.26); transform: translateX(-2px); }
</style>
</head>
<body>
<a href="/#projects" class="back-link" aria-label="Back to Crafts">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
  <span>Crafts</span>
</a>
<canvas id="scene" aria-label="A boy standing on beach sand with waves washing over his feet, the shore behind him and the sea in front. The sky, light and water follow the time of day. Drag to look around."></canvas>

<div class="clock">
  <div class="time" id="time">4:11 P.M.</div>
  <div class="date" id="date">Saturday, October 10, 2026</div>
</div>

<div class="controls">
  <div class="hint" id="hint">Drag to look around or up at the sky. Pinch to move closer.</div>
  <div class="bar">
    <button class="play" id="play" aria-pressed="false" aria-label="Play the day">
      <svg class="i-play" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9.5-5.5z" fill="currentColor"/></svg>
      <svg class="i-pause" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z" fill="currentColor"/></svg>
    </button>
    <button class="live" id="live" aria-pressed="true" aria-label="Follow the real time">Live</button>
    <div class="rail">
      <input id="hour" type="range" min="0" max="1439" step="1" value="971" aria-label="Time of day">
      <div class="ticks" aria-hidden="true">
        <span style="left:0%">12 am</span>
        <span style="left:25%">6 am</span>
        <span style="left:50%">Noon</span>
        <span style="left:75%">6 pm</span>
        <span style="left:100%">12 am</span>
      </div>
    </div>
  </div>
</div>

<div class="fallback" id="fallback">This scene needs WebGL, which your browser has turned off.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var canvas = document.getElementById('scene');
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  } catch (err) {
    document.getElementById('fallback').style.display = 'flex';
    return;
  }
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var PR = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(PR);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1600);
  var C = function (h) { return new THREE.Color(h); };
  var lerp = function (a, b, t) { return a + (b - a) * t; };
  var ss = function (a, b, x) { var t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  /* ================= 24-hour keyframes ================= */
  function K(h, top, mid, hor, sun, glow, anti, sh, dp, cs, cm, cl, foam, hs, hg, ga, hi, si, st) {
    return { h: h, top: C(top), mid: C(mid), hor: C(hor), sun: C(sun), glow: C(glow), anti: C(anti), sh: C(sh), dp: C(dp),
      cs: C(cs), cm: C(cm), cl: C(cl), foam: C(foam), hs: C(hs), hg: C(hg), ga: ga, hi: hi, si: si, st: st };
  }
  var NIGHT = ['#01030a','#040a1a','#0a1630','#000000','#1a2a55','#101a3a','#0a2a3a','#030a1a','#05080f','#101828','#26324f','#6f86a8','#2c4272','#050c1c'];
  var keys = [
    K(0, NIGHT[0],NIGHT[1],NIGHT[2],NIGHT[3],NIGHT[4],NIGHT[5],NIGHT[6],NIGHT[7],NIGHT[8],NIGHT[9],NIGHT[10],NIGHT[11],NIGHT[12],NIGHT[13], 0, 0.55, 0, 1),
    K(4.7,  '#02061a','#081230','#142444','#000000','#2a3a6a','#18284a','#0c3040','#041428','#080e1c','#141e34','#303c5c','#7890b0','#324b80','#08102a', 0.05, 0.58, 0, 0.95),
    K(5.2,  '#0c1a46','#243b78','#7a6a9a','#ffb080','#d48a9a','#4a4a8a','#16405a','#0a2050','#2a3560','#5a5a90','#a08aa8','#b8b8d8','#5a70b0','#1a2a50', 0.55, 0.7, 0, 0.45),
    K(5.6,  '#1d3f84','#5a7cb4','#f4a98a','#ffc090','#ff9a70','#7a6aa8','#2c6e86','#16356e','#506498','#e0a8a0','#ffd0b0','#ffe0d0','#9ab0d8','#3a4a78', 1, 0.85, 0.2, 0.1),
    K(5.95, '#2a5ca8','#6f9fd2','#ffc896','#ffd8a8','#ffa868','#a08ab8','#4a9aa6','#1c4486','#6a80b8','#ffd0a8','#fff0d8','#fff0e0','#bcd0ea','#4a6aa0', 1, 1.0, 0.75, 0),
    K(6.8,  '#2468c4','#58a6e8','#f0e4d4','#fff0d0','#ffd8a8','#a0b8e0','#58c8d8','#0f50a8','#84a8da','#f2e4d4','#fffaf0','#fffaf0','#c8dcf4','#4a78b8', 0.35, 1.05, 1.0, 0),
    K(8.5,  '#1c68cf','#44a0ea','#c8e8f6','#fff6e0','#ffe8c8','#b0c8e8','#62d4e2','#0e56b2','#86acde','#e6eff9','#ffffff','#ffffff','#cfe4ff','#3b73b8', 0.1, 1.05, 1.05, 0),
    K(12,   '#1862cc','#3a9ae8','#bfe6f6','#fff8ea','#fff0d8','#b0c8e8','#5cd6e6','#0c52b0','#8cb2e2','#e8f2fc','#ffffff','#ffffff','#cfe4ff','#3b73b8', 0, 1.1, 1.15, 0),
    K(15.5, '#1d65c4','#4aa2e6','#cfe6f2','#fff2d8','#ffe0b0','#b0c8e8','#63d6e4','#0f58b5','#86adde','#e4eef9','#ffffff','#ffffff','#cfe4ff','#3b73b8', 0.1, 1.05, 1.05, 0),
    K(17,   '#2559b0','#5aa4e0','#ffe2bc','#ffe0b0','#ffc890','#a8b8e0','#78dcd6','#1648a0','#7c98d0','#ffe2c4','#fff4dc','#fff4e4','#d8e0f0','#4a70b0', 0.45, 1.0, 0.95, 0),
    K(17.75,'#2a509a','#6a90d0','#ffc88a','#ffc890','#ffa860','#a090c0','#84dcd0','#173f98','#7488cc','#ffd0a0','#ffecd0','#fff0dc','#e0d8e8','#4a64a8', 0.85, 0.9, 0.8, 0),
    K(18.1, '#2a3a82','#8878b8','#ff9a68','#ff9c60','#ff7a48','#8a6aa8','#6a9eb0','#1c3a88','#5a62a0','#f0a090','#ffd0a0','#ffe0c8','#c8b0c8','#3a4a88', 1, 0.75, 0.35, 0),
    K(18.4, '#1a2a68','#4a4a90','#d0687a','#ff7048','#e0607a','#5a4a98','#2e5a78','#142e6a','#3a4478','#9a6a92','#e0907a','#d0b0c0','#7a80b8','#2a3a70', 0.85, 0.7, 0, 0.15),
    K(18.8, '#0a1450','#202e6a','#4a4a86','#000000','#6a5a9a','#3a3a7a','#17405c','#0a2050','#222c58','#3a4272','#6a6a98','#9aa8c8','#4a5c98','#1a2a58', 0.35, 0.6, 0, 0.65),
    K(19.3, '#030820','#07122e','#0e1c3a','#000000','#1a2a55','#101a3a','#0b2f42','#041024','#06101e','#121c34','#2c3a5c','#7a90b0','#2e4678','#06102a', 0.05, 0.55, 0, 1),
    K(24, NIGHT[0],NIGHT[1],NIGHT[2],NIGHT[3],NIGHT[4],NIGHT[5],NIGHT[6],NIGHT[7],NIGHT[8],NIGHT[9],NIGHT[10],NIGHT[11],NIGHT[12],NIGHT[13], 0, 0.55, 0, 1)
  ];
  var colorNames = ['top','mid','hor','sun','glow','anti','sh','dp','cs','cm','cl','foam','hs','hg'];
  var S = {}, N = { ga: 0, hi: 1, si: 1, st: 0 };
  colorNames.forEach(function (n) { S[n] = new THREE.Color(); });
  function sample(h) {
    var i = 0;
    while (i < keys.length - 2 && h >= keys[i + 1].h) i++;
    var a = keys[i], b = keys[i + 1], t = Math.max(0, Math.min(1, (h - a.h) / (b.h - a.h)));
    colorNames.forEach(function (n) { S[n].copy(a[n]).lerp(b[n], t); });
    N.ga = lerp(a.ga, b.ga, t); N.hi = lerp(a.hi, b.hi, t); N.si = lerp(a.si, b.si, t); N.st = lerp(a.st, b.st, t);
  }

  /* ================= shared GLSL ================= */
  var COMMON = [
    'uniform vec3 uTop, uMid, uHor, uGlow, uAnti, uSunCol, uSun, uMoon, uMoonCol;',
    'uniform float uTime, uStars, uGlowAmt;',
    'vec3 skyBase(vec3 d){',
    '  float h = clamp(d.y, 0.0, 1.0);',
    '  float t = pow(h, 0.5);',
    '  vec3 c = mix(uHor, uMid, smoothstep(0.0, 0.5, t));',
    '  c = mix(c, uTop, smoothstep(0.35, 1.0, t));',
    '  vec2 hd = normalize(d.xz + vec2(0.00001));',
    '  vec2 sd = normalize(uSun.xz + vec2(0.00001));',
    '  float az = dot(hd, sd) * 0.5 + 0.5;',
    '  float low = 1.0 - smoothstep(0.0, 0.55, h);',
    '  c = mix(c, uGlow, clamp(uGlowAmt * pow(az, 2.5) * low, 0.0, 1.0));',
    '  c = mix(c, uAnti, clamp(uGlowAmt * 0.35 * pow(1.0 - az, 2.0) * (1.0 - smoothstep(0.0, 0.35, h)), 0.0, 1.0));',
    '  float s = max(dot(d, normalize(uSun)), 0.0);',
    '  float sv = smoothstep(-0.12, 0.05, uSun.y);',
    '  c += uSunCol * (pow(s, 6.0) * 0.14 + pow(s, 40.0) * 0.3) * sv;',
    '  c += uMoonCol * pow(max(dot(d, normalize(uMoon)), 0.0), 12.0) * 0.07;',
    '  return c;',
    '}'
  ].join('\n');
  var NOISE2 = [
    'float hash21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }',
    'float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);',
    '  return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x), mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x), f.y); }',
    'float fbm2(vec2 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++){ s += a * vn(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; } return s; }'
  ].join('\n');
  var NOISE3 = [
    'float hash31(vec3 p){ p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yxz + 33.33); return fract((p.x + p.y) * p.z); }',
    'float vn3(vec3 p){ vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);',
    '  return mix(mix(mix(hash31(i), hash31(i + vec3(1.0, 0.0, 0.0)), f.x), mix(hash31(i + vec3(0.0, 1.0, 0.0)), hash31(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),',
    '             mix(mix(hash31(i + vec3(0.0, 0.0, 1.0)), hash31(i + vec3(1.0, 0.0, 1.0)), f.x), mix(hash31(i + vec3(0.0, 1.0, 1.0)), hash31(i + vec3(1.0, 1.0, 1.0)), f.x), f.y), f.z); }',
    'float fbm3(vec3 p){ return vn3(p) * 0.55 + vn3(p * 2.1) * 0.3 + vn3(p * 4.3) * 0.15; }'
  ].join('\n');

  /* uniform entries shared by sky, ocean and everything that reads the sky */
  var U = {
    uTop: { value: new THREE.Color() }, uMid: { value: new THREE.Color() }, uHor: { value: new THREE.Color() },
    uGlow: { value: new THREE.Color() }, uAnti: { value: new THREE.Color() }, uSunCol: { value: new THREE.Color() },
    uSun: { value: new THREE.Vector3(0, 1, 0) }, uMoon: { value: new THREE.Vector3(0, 1, 0) }, uMoonCol: { value: new THREE.Color() },
    uTime: { value: 0 }, uStars: { value: 0 }, uGlowAmt: { value: 0 }, uCl: { value: new THREE.Color() }
  };
  function uni(extra) { return Object.assign({}, U, extra || {}); }

  /* ================= sky dome ================= */
  var skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, uniforms: uni(),
    vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: [
      COMMON, NOISE2, 'uniform vec3 uCl; varying vec3 vDir;',
      'void main(){',
      '  vec3 d = normalize(vDir);',
      '  vec3 c = skyBase(d);',
      '  float s = dot(d, normalize(uSun));',
      '  float sv = smoothstep(-0.02, 0.04, uSun.y) * step(0.0, d.y);',
      '  c = mix(c, uSunCol * 1.3 + vec3(0.12), smoothstep(0.99955, 0.99975, s) * sv);',
      '  if (d.y > 0.0) {',
      '    vec2 q = d.xz / (d.y + 0.14); q *= vec2(0.8, 2.2); q.x += uTime * 0.012;',
      '    float f = fbm2(q * 1.4 + vec2(3.0, 1.0));',
      '    float cov = smoothstep(0.5, 0.85, f) * smoothstep(0.04, 0.3, d.y) * 0.5 * (1.0 - uStars * 0.85);',
      '    c = mix(c, uCl * 1.05, cov);',
      '  }',
      '  gl_FragColor = vec4(c, 1.0);',
      '}'
    ].join('\n')
  });
  var sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 20), skyMat);
  sky.renderOrder = -10;
  scene.add(sky);

  /* ================= stars, milky way ================= */
  function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var starGroup = new THREE.Group();
  scene.add(starGroup);
  (function buildStars() {
    var N1 = 1500, N2 = 5200, NT = N1 + N2, i;
    var pos = new Float32Array(NT * 3), size = new Float32Array(NT), mag = new Float32Array(NT), tint = new Float32Array(NT * 3), rnd = new Float32Array(NT * 2);
    var r = rng(2026);
    var tints = [[0.75, 0.85, 1.0], [1, 1, 1], [1, 0.92, 0.8], [1, 0.82, 0.7]];
    for (i = 0; i < N1; i++) {
      var z = r() * 2 - 1, a = r() * Math.PI * 2, s = Math.sqrt(1 - z * z), m = Math.pow(r(), 5);
      pos[i * 3] = s * Math.cos(a) * 850; pos[i * 3 + 1] = z * 850; pos[i * 3 + 2] = s * Math.sin(a) * 850;
      mag[i] = 0.35 + 0.65 * m; size[i] = 1.2 + 2.4 * m;
      var tc = tints[Math.floor(r() * 4)]; tint[i * 3] = tc[0]; tint[i * 3 + 1] = tc[1]; tint[i * 3 + 2] = tc[2];
    }
    var nM = new THREE.Vector3(0.35, 0.8, 0.5).normalize();
    var e1 = new THREE.Vector3(1, 0, 0).cross(nM).normalize(), e2 = nM.clone().cross(e1), v = new THREE.Vector3();
    for (; i < NT; i++) {

    U.uSun.value.copy(sunDir); U.uMoon.value.copy(moonDir);
    U.uMoonCol.value.set(0.78, 0.86, 1.0).multiplyScalar(N.st * moonVis);
    U.uGlowAmt.value = N.ga; U.uStars.value = N.st; U.uCl.value.copy(S.cl);

    var ou = oceanMat.uniforms;
    ou.uShallow.value.copy(S.sh); ou.uDeep.value.copy(S.dp); ou.uFoam.value.copy(S.foam);

    var cu = cloudMat.uniforms;
    cu.uShadow.value.copy(S.cs); cu.uMid.value.copy(S.cm); cu.uLit.value.copy(S.cl); cu.uSunVis.value = sunVis;
    cloudL.copy(sunDir).multiplyScalar(0.5).add(new THREE.Vector3(0.4, 0.9, 0.4)).normalize();

    sunLight.position.copy(sunDir).multiplyScalar(30);
    sunLight.color.copy(S.sun).lerp(new THREE.Color(1, 1, 1), 0.35);
    sunLight.intensity = N.si * sunVis;
    moonLight.position.copy(moonDir).multiplyScalar(30);
    moonLight.intensity = 0.55 * N.st * moonVis;
    hemi.color.copy(S.hs); hemi.groundColor.copy(S.hg); hemi.intensity = N.hi;
    fill.intensity = 0.15 + 0.4 * (1 - N.st);
    var su = sandMat.uniforms;
    su.uHs.value.copy(S.hs); su.uHg.value.copy(S.hg); su.uHi.value = N.hi;
    su.uSunL.value.copy(sunLight.color); su.uSunI.value = sunLight.intensity; su.uMoonI.value = moonLight.intensity;

    starGroup.quaternion.setFromAxisAngle(poleAxis, -(h / 24) * Math.PI * 2 * 1.0027 + 1.3);
    moon.position.copy(moonDir).multiplyScalar(700);
    moon.lookAt(0, 0, 0);
    moon.visible = moonDir.y > -0.12;
    moonU.uAmt.value = N.st * moonVis;
    farLights.material.opacity = ss(0.3, 0.9, N.st) * 0.9;

    var total = Math.floor(m), h24 = Math.floor(total / 60) % 24, mm = total % 60;
    var label = ((h24 % 12) || 12) + ':' + (mm < 10 ? '0' : '') + mm + (h24 >= 12 ? ' P.M.' : ' A.M.');
    if (label !== lastLabel) { timeEl.textContent = label; lastLabel = label; updateDate(); }
  }

  var slider = document.getElementById('hour');
  (function paintTrack() {
    var stops = [];
    for (var hh = 0; hh <= 24; hh++) {
      sample(hh);
      stops.push('#' + S.hor.clone().lerp(S.mid, 0.4).getHexString() + ' ' + (hh / 24 * 100).toFixed(2) + '%');
    }
    slider.style.setProperty('--sky', 'linear-gradient(to right,' + stops.join(',') + ')');
  })();
  slider.addEventListener('input', function () { setLive(false); setHour(+slider.value); });
  setHour(localMinutes());
  slider.value = Math.floor(curMin);

  var playing = false, playBtn = document.getElementById('play');
  playBtn.addEventListener('click', function () {
    playing = !playing;
    if (playing) setLive(false);
    playBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
    playBtn.setAttribute('aria-label', playing ? 'Pause the day' : 'Play the day');
    touched();
  });

  /* ================= camera ================= */
  var cam = reduce
    ? { az: 0, pitch: 0.1, r: 5.6, taz: 0, tp: 0.1, tr: 5.6 }
    : { az: 0.65, pitch: 0.4, r: 11, taz: 0, tp: 0.1, tr: 5.6 };
  var lastInput = -10, now = 0, hint = document.getElementById('hint');
  function touched() { lastInput = now; hint.classList.add('gone'); }
  function clampCam() {
    var TWO_PI = Math.PI * 2;
    while (cam.taz > TWO_PI) { cam.taz -= TWO_PI; cam.az -= TWO_PI; }
    while (cam.taz < -TWO_PI) { cam.taz += TWO_PI; cam.az += TWO_PI; }
    cam.tp = Math.max(-0.2, Math.min(1.2, cam.tp));
    cam.tr = Math.max(2.2, Math.min(16, cam.tr));
  }
  var ptrs = new Map(), pinch0 = 0;
  function pinchDist() { var p = Array.from(ptrs.values()); return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1; }
  canvas.addEventListener('pointerdown', function (e) {
    canvas.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) pinch0 = pinchDist();
    touched();
  });
  canvas.addEventListener('pointermove', function (e) {
    var prev = ptrs.get(e.pointerId);
    if (!prev) return;
    var dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    prev.x = e.clientX; prev.y = e.clientY;
    if (ptrs.size === 1) { cam.taz -= dx * 0.005; cam.tp += dy * 0.004; }
    else if (ptrs.size === 2) { var d = pinchDist(); cam.tr *= pinch0 / d; pinch0 = d; }
    clampCam(); touched();
  });
  function release(e) { ptrs.delete(e.pointerId); }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    cam.tr *= Math.exp(e.deltaY * 0.001);
    clampCam(); touched();
  }, { passive: false });

  function updateCamera(dt, time) {
    var k = 1 - Math.exp(-dt * (reduce ? 10 : 2.2));
    cam.az += (cam.taz - cam.az) * k;
    cam.pitch += (cam.tp - cam.pitch) * k;
    cam.r += (cam.tr - cam.r) * k;
    var idle = reduce ? 0 : Math.max(0, Math.min(1, (time - lastInput - 3) / 3));
    var az = cam.az + Math.sin(time * 0.17) * 0.06 * idle;
    var pitch = cam.pitch + Math.sin(time * 0.23) * 0.012 * idle;
    camera.position.set(Math.sin(az) * cam.r, 1.4 + (cam.r - 5.6) * 0.06, Math.cos(az) * cam.r);
    camera.lookAt(0, 1.2, 0);
    camera.rotateX(pitch);
  }
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w / h < 1 ? 50 + (1 - w / h) * 26 : 50;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  /* ================= loop ================= */
  var last = performance.now();
  function frame(nowMs) {
    var dt = Math.min(0.05, (nowMs - last) / 1000); last = nowMs;
    now += dt;
    var wt = now * (reduce ? 0.3 : 1);
    U.uTime.value = wt;

    if (playing) {
      curMin = (curMin + dt * 12) % 1440;
      slider.value = Math.floor(curMin);
      setHour(curMin);
    } else if (live) {
      liveTick += dt;
      if (liveTick > 1) {
        liveTick = 0;
        curMin = localMinutes();
        slider.value = Math.floor(curMin);
        setHour(curMin);
      }
    }

    boy.position.y = 0;
    upper.rotation.z = 0.02 + Math.sin(wt * 0.9) * 0.006;
    upper.rotation.x = Math.sin(wt * 1.1) * 0.004;
    head.rotation.y = Math.sin(wt * 0.3) * 0.1;
    head.rotation.x = 0.07 + Math.sin(wt * 0.21) * 0.03;

    if (!reduce) {
      clouds.forEach(function (g) {
        g.position.x += g.userData.speed * dt;
        if (g.position.x > 340) g.position.x = -340;
      });
    }

    updateCamera(dt, now);
    camera.updateMatrixWorld();
    cloudMat.uniforms.uL.value.copy(cloudL).transformDirection(camera.matrixWorldInverse);
    cloudMat.uniforms.uSunV.value.copy(sunDir).transformDirection(camera.matrixWorldInverse);

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
