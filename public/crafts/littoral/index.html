<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>Two screens, one sea</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --ink: #fffaf0;
                --ink-soft: rgba(255, 250, 240, 0.8);
                --glow: rgba(8, 30, 70, 0.45);
                --bg: #0a1630;
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    --bg: #050c1c;
                }
            }
            :root[data-theme="dark"] {
                --bg: #050c1c;
            }
            html {
                scroll-padding-top: env(safe-area-inset-top, 0px);
            }
            html,
            body {
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: var(--bg);
            }
            body {
                font-family:
                    "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Nunito",
                    system-ui, sans-serif;
                color: var(--ink);
                -webkit-font-smoothing: antialiased;
            }
            #scene {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                display: block;
                touch-action: none;
                cursor: grab;
            }
            #scene:active {
                cursor: grabbing;
            }

            .clock {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                padding: calc(env(safe-area-inset-top, 0px) + 22px) 16px 0;
                text-align: center;
                pointer-events: none;
                text-shadow:
                    0 2px 22px var(--glow),
                    0 0 2px rgba(0, 0, 0, 0.12);
                transition: opacity 0.5s ease;
            }
            .clock.loading {
                opacity: 0.65;
            }
            .clock.loading .time {
                font-size: clamp(1.2rem, 4vw, 1.8rem);
                letter-spacing: 0.08em;
                animation: timeLoadingPulse 1.4s ease-in-out infinite;
            }
            @keyframes timeLoadingPulse {
                0%, 100% { opacity: 0.4; }
                50% { opacity: 0.95; }
            }
            .time {
                font-size: clamp(2.3rem, 9vw, 3.7rem);
                font-weight: 500;
                line-height: 1.05;
                letter-spacing: 0.01em;
                font-variant-numeric: tabular-nums;
            }
            .date {
                margin-top: 6px;
                font-size: clamp(0.95rem, 3.4vw, 1.2rem);
                font-weight: 400;
                color: var(--ink-soft);
            }

            .controls {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                text-shadow: 0 1px 12px var(--glow);
            }
            .hint {
                font-size: 0.9rem;
                color: var(--ink-soft);
                transition: opacity 0.9s ease;
                text-align: center;
            }
            .hint.gone {
                opacity: 0;
            }
            .bar {
                width: min(94vw, 540px);
                display: flex;
                align-items: flex-start;
                gap: 14px;
            }
            .play {
                flex: none;
                width: 40px;
                height: 40px;
                border-radius: 50%;
                padding: 0;
                border: 1px solid rgba(255, 250, 240, 0.55);
                background: rgba(255, 250, 240, 0.16);
                color: var(--ink);
                display: grid;
                place-items: center;
                cursor: pointer;
                -webkit-backdrop-filter: blur(6px);
                backdrop-filter: blur(6px);
            }
            .play:focus-visible {
                outline: 2px solid var(--ink);
                outline-offset: 3px;
            }
            .play .i-pause {
                display: none;
            }
            .live {
                flex: none;
                height: 40px;
                padding: 0 14px;
                border-radius: 20px;
                font: inherit;
                font-size: 0.85rem;
                text-shadow: none;
                border: 1px solid rgba(255, 250, 240, 0.55);
                background: rgba(255, 250, 240, 0.16);
                color: var(--ink);
                display: inline-flex;
                align-items: center;
                gap: 7px;
                cursor: pointer;
                -webkit-backdrop-filter: blur(6px);
                backdrop-filter: blur(6px);
            }
            .live::before {
                content: "";
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: rgba(255, 250, 240, 0.55);
            }
            .live[aria-pressed="true"] {
                background: rgba(255, 250, 240, 0.92);
                color: #0b1a38;
            }
            .live[aria-pressed="true"]::before {
                background: #e5484d;
            }
            .live:focus-visible {
                outline: 2px solid var(--ink);
                outline-offset: 3px;
            }
            .play[aria-pressed="true"] .i-play {
                display: none;
            }
            .play[aria-pressed="true"] .i-pause {
                display: block;
            }
            .rail {
                flex: 1;
                min-width: 0;
            }
            .ticks {
                position: relative;
                height: 18px;
                margin-top: -4px;
                font-size: 0.78rem;
                color: var(--ink-soft);
            }
            .ticks span {
                position: absolute;
                top: 0;
                transform: translateX(-50%);
                white-space: nowrap;
            }
            .ticks span:first-child {
                transform: none;
            }
            .ticks span:last-child {
                transform: translateX(-100%);
            }
            input[type="range"] {
                -webkit-appearance: none;
                appearance: none;
                width: 100%;
                height: 40px;
                background: transparent;
                margin: 0;
                cursor: pointer;
                display: block;
            }
            input[type="range"]::-webkit-slider-runnable-track {
                height: 8px;
                border-radius: 8px;
                background: var(--sky, rgba(255, 250, 240, 0.4));
                box-shadow: 0 0 0 1px rgba(255, 250, 240, 0.4);
            }
            input[type="range"]::-moz-range-track {
                height: 8px;
                border-radius: 8px;
                background: var(--sky, rgba(255, 250, 240, 0.4));
                box-shadow: 0 0 0 1px rgba(255, 250, 240, 0.4);
            }
            input[type="range"]::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 24px;
                height: 24px;
                margin-top: -8px;
                border-radius: 50%;
                background: var(--ink);
                border: 0;
                box-shadow: 0 2px 12px rgba(8, 30, 70, 0.55);
            }
            input[type="range"]::-moz-range-thumb {
                width: 24px;
                height: 24px;
                border-radius: 50%;
                background: var(--ink);
                border: 0;
                box-shadow: 0 2px 12px rgba(8, 30, 70, 0.55);
            }
            input[type="range"]:focus-visible {
                outline: 2px solid var(--ink);
                outline-offset: 4px;
                border-radius: 8px;
            }

            .fallback {
                position: fixed;
                inset: 0;
                display: none;
                align-items: center;
                justify-content: center;
                padding: 32px;
                text-align: center;
            }
            .back-link {
                position: fixed;
                top: calc(env(safe-area-inset-top, 0px) + 20px);
                left: 20px;
                z-index: 50;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 8px 16px;
                border-radius: 9999px;
                background: rgba(255, 250, 240, 0.14);
                border: 1px solid rgba(255, 250, 240, 0.28);
                color: var(--ink);
                font-size: 0.85rem;
                font-weight: 500;
                text-decoration: none;
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                transition:
                    background 0.2s,
                    transform 0.2s,
                    box-shadow 0.2s;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            }
            .back-link:hover {
                background: rgba(255, 250, 240, 0.26);
                transform: translateX(-2px);
            }
        </style>
    </head>
    <body>
        <a href="/#projects" class="back-link" aria-label="Back to Crafts">
            <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="m12 19-7-7 7-7" />
                <path d="M19 12H5" />
            </svg>
            <span>Crafts</span>
        </a>
        <canvas
            id="scene"
            aria-label="A character standing on beach sand with waves washing over his feet, the shore behind him and the sea in front. The sky, light and water follow the time of day. Drag to look around."
        ></canvas>

        <div class="clock loading" id="clock">
            <div class="time" id="time">Loading time…</div>
            <div class="date" id="date"></div>
        </div>

        <div class="controls">
            <div class="hint" id="hint">
                Drag to look around. Right-click to reset view. Pinch to zoom.
            </div>
            <div class="bar">
                <button
                    class="play"
                    id="play"
                    aria-pressed="false"
                    aria-label="Play the day"
                >
                    <svg
                        class="i-play"
                        width="16"
                        height="16"
                        viewBox="0 0 16 16"
                        aria-hidden="true"
                    >
                        <path d="M4 2.5v11l9.5-5.5z" fill="currentColor" />
                    </svg>
                    <svg
                        class="i-pause"
                        width="16"
                        height="16"
                        viewBox="0 0 16 16"
                        aria-hidden="true"
                    >
                        <path
                            d="M4 2.5h3v11H4zM9 2.5h3v11H9z"
                            fill="currentColor"
                        />
                    </svg>
                </button>
                <button
                    class="live"
                    id="live"
                    aria-pressed="true"
                    aria-label="Follow the real time"
                >
                    Live
                </button>
                <div class="rail">
                    <input
                        id="hour"
                        type="range"
                        min="0"
                        max="1439"
                        step="1"
                        value="0"
                        aria-label="Time of day"
                        disabled
                    />
                    <div class="ticks" aria-hidden="true">
                        <span style="left: 0%">12 am</span>
                        <span style="left: 25%">6 am</span>
                        <span style="left: 50%">Noon</span>
                        <span style="left: 75%">6 pm</span>
                        <span style="left: 100%">12 am</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="fallback" id="fallback">
            This scene needs WebGL, which your browser has turned off.
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
        <script>
            if (!window.THREE || !window.THREE.GLTFLoader) {
                document.write('<script src="GLTFLoader.js"><\/script>');
            }
        </script>

                var reduce =

                var camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1600);
                var C = function (h) {
                    return new THREE.Color(h);

                var lerp = function (a, b, t) {
                    return a + (b - a) * t;
                };
                var ss = function (a, b, x) {

                    return t * t * (3 - 2 * t);

                function sample(h) {
                    var i = 0;
                    while (i < keys.length - 2 && h >= keys[i + 1].h) i++;
                    var a = keys[i],
                        b = keys[i + 1],
                        t = Math.max(0, Math.min(1, (h - a.h) / (b.h - a.h)));
                    colorNames.forEach(function (n) {
                        S[n].copy(a[n]).lerp(b[n], t);
                    });
                    N.ga = lerp(a.ga, b.ga, t);
                    N.hi = lerp(a.hi, b.hi, t);
                    N.si = lerp(a.si, b.si, t);
                    N.st = lerp(a.st, b.st, t);

                    "vec3 skyBase(vec3 d){",
                    "  float h = clamp(d.y, 0.0, 1.0);",
                    "  float t = pow(h, 0.5);",
                    "  vec3 c = mix(uHor, uMid, smoothstep(0.0, 0.5, t));",
                    "  c = mix(c, uTop, smoothstep(0.35, 1.0, t));",
                    "  vec2 hd = normalize(d.xz + vec2(0.00001));",
                    "  vec2 sd = normalize(uSun.xz + vec2(0.00001));",
                    "  float az = dot(hd, sd) * 0.5 + 0.5;",
                    "  float low = 1.0 - smoothstep(0.0, 0.55, h);",
                    "  c = mix(c, uGlow, clamp(uGlowAmt * pow(az, 2.5) * low, 0.0, 1.0));",
                    "  c = mix(c, uAnti, clamp(uGlowAmt * 0.35 * pow(1.0 - az, 2.0) * (1.0 - smoothstep(0.0, 0.35, h)), 0.0, 1.0));",
                    "  float s = max(dot(d, normalize(uSun)), 0.0);",
                    "  float sv = smoothstep(-0.12, 0.05, uSun.y);",
                    "  c += uSunCol * (pow(s, 6.0) * 0.14 + pow(s, 40.0) * 0.3) * sv;",
                    "  c += uMoonCol * pow(max(dot(d, normalize(uMoon)), 0.0), 12.0) * 0.07;",
                    "  return c;",
                    "}",
                ].join("\n");
                var NOISE2 = [
                    "float hash21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }",
                    "float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);",
                    "  return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x), mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x), f.y); }",
                    "float fbm2(vec2 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++){ s += a * vn(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; } return s; }",
                ].join("\n");
                var NOISE3 = [
                    "float hash31(vec3 p){ p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yxz + 33.33); return fract((p.x + p.y) * p.z); }",
                    "float vn3(vec3 p){ vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);",
                    "  return mix(mix(mix(hash31(i), hash31(i + vec3(1.0, 0.0, 0.0)), f.x), mix(hash31(i + vec3(0.0, 1.0, 0.0)), hash31(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),",
                    "             mix(mix(hash31(i + vec3(0.0, 0.0, 1.0)), hash31(i + vec3(1.0, 0.0, 1.0)), f.x), mix(hash31(i + vec3(0.0, 1.0, 1.0)), hash31(i + vec3(1.0, 1.0, 1.0)), f.x), f.y), f.z); }",
                    "float fbm3(vec3 p){ return vn3(p) * 0.55 + vn3(p * 2.1) * 0.3 + vn3(p * 4.3) * 0.15; }",
                ].join("\n");

                /* uniform entries shared by sky, ocean and everything that reads the sky */
                var U = {
                    uTop: { value: new THREE.Color() },
                    uMid: { value: new THREE.Color() },
                    uHor: { value: new THREE.Color() },
                    uGlow: { value: new THREE.Color() },
                    uAnti: { value: new THREE.Color() },
                    uSunCol: { value: new THREE.Color() },
                    uSun: { value: new THREE.Vector3(0, 1, 0) },
                    uMoon: { value: new THREE.Vector3(0, 1, 0) },
                    uMoonCol: { value: new THREE.Color() },
                    uTime: { value: 0 },
                    uStars: { value: 0 },
                    uGlowAmt: { value: 0 },
                    uCl: { value: new THREE.Color() },
                };
                function uni(extra) {
                    return Object.assign({}, U, extra || {});
                }

                /* ================= sky dome ================= */
                var skyMat = new THREE.ShaderMaterial({
                    side: THREE.BackSide,
                    depthWrite: false,
                    uniforms: uni(),
                    vertexShader:
                        "varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
                    fragmentShader: [
                        COMMON,
                        NOISE2,
                        "uniform vec3 uCl; varying vec3 vDir;",
                        "void main(){",
                        "  vec3 d = normalize(vDir);",
                        "  vec3 c = skyBase(d);",
                        "  float s = dot(d, normalize(uSun));",
                        "  float sv = smoothstep(-0.02, 0.04, uSun.y) * step(0.0, d.y);",
                        "  c = mix(c, uSunCol * 1.3 + vec3(0.12), smoothstep(0.99955, 0.99975, s) * sv);",
                        "  if (d.y > 0.0) {",
                        "    vec2 q = d.xz / (d.y + 0.14); q *= vec2(0.8, 2.2); q.x += uTime * 0.012;",
                        "    float f = fbm2(q * 1.4 + vec2(3.0, 1.0));",
                        "    float cov = smoothstep(0.5, 0.85, f) * smoothstep(0.04, 0.3, d.y) * 0.5 * (1.0 - uStars * 0.85);",
                        "    c = mix(c, uCl * 1.05, cov);",
                        "  }",
                        "  gl_FragColor = vec4(c, 1.0);",
                        "}",
                    ].join("\n"),
                });
                var sky = new THREE.Mesh(
                    new THREE.SphereGeometry(900, 32, 20),
                    skyMat,
                );
                sky.renderOrder = -10;
                scene.add(sky);

                /* ================= stars, milky way ================= */
                function rng(a) {
                    return function () {
                        a |= 0;
                        a = (a + 0x6d2b79f5) | 0;
                        var t = Math.imul(a ^ (a >>> 15), 1 | a);
                        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                    };
                }
                var starGroup = new THREE.Group();
                scene.add(starGroup);
                (function buildStars() {
                    var N1 = 1500,
                        N2 = 5200,
                        NT = N1 + N2,
                        i;
                    var pos = new Float32Array(NT * 3),
                        size = new Float32Array(NT),
                        mag = new Float32Array(NT),
                        tint = new Float32Array(NT * 3),
                        rnd = new Float32Array(NT * 2);
                    var r = rng(2026);
                    var tints = [
                        [0.75, 0.85, 1.0],
                        [1, 1, 1],
                        [1, 0.92, 0.8],
                        [1, 0.82, 0.7],
                    ];
                    for (i = 0; i < N1; i++) {
                        var z = r() * 2 - 1,
                            a = r() * Math.PI * 2,
                            s = Math.sqrt(1 - z * z),
                            m = Math.pow(r(), 5);
                        pos[i * 3] = s * Math.cos(a) * 850;
                        pos[i * 3 + 1] = z * 850;
                        pos[i * 3 + 2] = s * Math.sin(a) * 850;
                        mag[i] = 0.35 + 0.65 * m;
                        size[i] = 1.2 + 2.4 * m;
                        var tc = tints[Math.floor(r() * 4)];
                        tint[i * 3] = tc[0];
                        tint[i * 3 + 1] = tc[1];
                        tint[i * 3 + 2] = tc[2];
                    }
                    var nM = new THREE.Vector3(0.35, 0.8, 0.5).normalize();
                    var e1 = new THREE.Vector3(1, 0, 0).cross(nM).normalize(),
                        e2 = nM.clone().cross(e1),
                        v = new THREE.Vector3();
                    for (; i < NT; i++) {
                        var th = r() * Math.PI * 2,
                            g = (r() + r() + r() - 1.5) * 0.35;
                        v.copy(e1)
                            .multiplyScalar(Math.cos(th))
                            .addScaledVector(e2, Math.sin(th))
                            .addScaledVector(nM, g)
                            .normalize();
                        pos[i * 3] = v.x * 850;
                        pos[i * 3 + 1] = v.y * 850;
                        pos[i * 3 + 2] = v.z * 850;
                        mag[i] = 0.12 + 0.2 * r();
                        size[i] = 1.0 + 0.7 * r();
                        tint[i * 3] = 0.8 + 0.2 * r();
                        tint[i * 3 + 1] = 0.85 + 0.1 * r();
                        tint[i * 3 + 2] = 1.0;
                    }
                    for (i = 0; i < NT; i++) {
                        rnd[i * 2] = r();
                        rnd[i * 2 + 1] = r();
                    }
                    var geo = new THREE.BufferGeometry();
                    geo.setAttribute(
                        "position",
                        new THREE.BufferAttribute(pos, 3),
                    );
                    geo.setAttribute(
                        "aSize",
                        new THREE.BufferAttribute(size, 1),
                    );
                    geo.setAttribute("aMag", new THREE.BufferAttribute(mag, 1));
                    geo.setAttribute(
                        "aTint",
                        new THREE.BufferAttribute(tint, 3),
                    );
                    geo.setAttribute("aRnd", new THREE.BufferAttribute(rnd, 2));
                    var mat = new THREE.ShaderMaterial({
                        transparent: true,
                        depthWrite: false,
                        blending: THREE.AdditiveBlending,
                        uniforms: {
                            uTime: U.uTime,
                            uStars: U.uStars,
                            uPx: { value: PR },
                        },
                        vertexShader: [
                            "attribute float aSize; attribute float aMag; attribute vec3 aTint; attribute vec2 aRnd;",
                            "uniform float uTime, uPx, uStars; varying vec3 vCol; varying float vY;",
                            "void main(){",
                            "  vec4 w = modelMatrix * vec4(position, 1.0);",
                            "  vY = w.y / length(w.xyz);",
                            "  float tw = 0.8 + 0.2 * sin(uTime * (1.0 + aRnd.x * 2.0) + aRnd.y * 6.28);",
                            "  vCol = aTint * aMag * tw * uStars;",
                            "  gl_PointSize = aSize * uPx;",
                            "  gl_Position = projectionMatrix * viewMatrix * w;",
                            "}",
                        ].join("\n"),
                        fragmentShader: [
                            "varying vec3 vCol; varying float vY;",
                            "void main(){ if (vY < 0.0) discard; float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.05, d) * smoothstep(0.0, 0.1, vY); gl_FragColor = vec4(vCol * a, 1.0); }",
                        ].join("\n"),
                    });
                    var pts = new THREE.Points(geo, mat);
                    pts.frustumCulled = false;
                    pts.renderOrder = -8;
                    starGroup.add(pts);
                })();

                /* ================= moon ================= */
                var moonU = {
                    uCol: { value: new THREE.Color(0.78, 0.86, 1.0) },
                    uAmt: { value: 0 },
                    uPhase: { value: 0.95 },
                };
                var moon = new THREE.Mesh(
                    new THREE.PlaneGeometry(120, 120),
                    new THREE.ShaderMaterial({
                        transparent: true,
                        depthWrite: false,
                        blending: THREE.AdditiveBlending,
                        uniforms: moonU,
                        vertexShader:
                            "varying vec2 vUv; varying float vWy; void main(){ vUv = uv; vec4 w = modelMatrix * vec4(position, 1.0); vWy = w.y; gl_Position = projectionMatrix * viewMatrix * w; }",
                        fragmentShader: [
                            NOISE2,
                            "uniform vec3 uCol; uniform float uAmt, uPhase; varying vec2 vUv; varying float vWy;",
                            "void main(){",
                            "  if (vWy < 0.0) discard;",
                            "  vec2 p = (vUv - 0.5) * 2.0; float r = length(p);",
                            "  vec2 q = p / 0.22; float rq = dot(q, q);",
                            "  float disc = 1.0 - smoothstep(0.97, 1.0, sqrt(rq));",
                            "  float z = sqrt(max(1.0 - rq, 0.0));",
                            "  vec3 n = vec3(q, z);",
                            "  vec3 L = normalize(vec3(sin(uPhase), 0.18, cos(uPhase)));",
                            "  float lit = smoothstep(-0.04, 0.08, dot(n, L));",
                            "  float m = vn(q * 2.6) * 0.5 + vn(q * 6.0) * 0.3 + vn(q * 14.0) * 0.2;",
                            "  vec3 surf = mix(vec3(0.55, 0.58, 0.66), vec3(0.96, 0.94, 0.88), smoothstep(0.38, 0.62, m));",
                            "  surf *= 0.75 + 0.25 * z;",
                            "  vec3 body = surf * lit + vec3(0.035, 0.05, 0.09) * (1.0 - lit);",
                            "  float glow = exp(-r * r * 14.0) * 0.5 + exp(-r * r * 3.0) * 0.08;",
                            "  vec3 col = body * disc * 1.1 + uCol * glow;",
                            "  gl_FragColor = vec4(col * uAmt, 1.0);",
                            "}",
                        ].join("\n"),
                    }),
                );
                moon.renderOrder = -7;
                scene.add(moon);

                /* ================= distant lights on the water (night) ================= */
                var dotTex = (function () {
                    var c = document.createElement("canvas");
                    c.width = c.height = 32;
                    var x = c.getContext("2d"),
                        g = x.createRadialGradient(16, 16, 0, 16, 16, 16);
                    g.addColorStop(0, "rgba(255,255,255,1)");
                    g.addColorStop(0.35, "rgba(255,255,255,0.55)");
                    g.addColorStop(1, "rgba(255,255,255,0)");
                    x.fillStyle = g;
                    x.fillRect(0, 0, 32, 32);
                    return new THREE.CanvasTexture(c);
                })();
                var farLights = (function () {
                    var r = rng(77),
                        n = 26,
                        p = new Float32Array(n * 3);
                    for (var i = 0; i < n; i++) {
                        var x = (r() - 0.5) * 520;
                        p[i * 3] = x;
                        p[i * 3 + 1] = 0.35 + r() * 0.7;
                        p[i * 3 + 2] = -(300 + r() * 20) + Math.abs(x) * 0.02;
                    }
                    var g = new THREE.BufferGeometry();
                    g.setAttribute("position", new THREE.BufferAttribute(p, 3));
                    var m = new THREE.PointsMaterial({
                        size: 4,
                        sizeAttenuation: false,
                        map: dotTex,
                        color: 0xffd7a0,
                        transparent: true,
                        opacity: 0,
                        depthWrite: false,
                        blending: THREE.AdditiveBlending,
                    });
                    var pts = new THREE.Points(g, m);
                    pts.frustumCulled = false;
                    pts.renderOrder = -6;
                    scene.add(pts);
                    return pts;
                })();

                /* ================= ocean ================= */
                var oceanMat = new THREE.ShaderMaterial({
                    transparent: true,
                    uniforms: uni({
                        uShallow: { value: new THREE.Color() },
                        uDeep: { value: new THREE.Color() },
                        uFoam: { value: new THREE.Color() },
                    }),
                    vertexShader: [
                        "uniform float uTime; varying vec3 vWorld; varying float vH;",
                        "float waveH(vec2 p, float t){ return sin(p.x*0.22+t*0.5)*0.10 + sin(p.y*0.31-t*0.9)*0.14 + sin((p.x*0.6+p.y*0.8)*0.4-t*1.2)*0.07; }",
                        "void main(){",
                        "  vec3 p = position; float h = waveH(p.xz, uTime); p.y += h; vH = h;",
                        "  vec4 w = modelMatrix * vec4(p, 1.0); vWorld = w.xyz;",
                        "  gl_Position = projectionMatrix * viewMatrix * w;",
                        "}",
                    ].join("\n"),
                    fragmentShader: [
                        COMMON,
                        NOISE2,
                        "uniform vec3 uShallow, uDeep, uFoam; varying vec3 vWorld; varying float vH;",
                        "float sandBase(float z){ return z >= 0.0 ? -0.52 + 0.16*min(z,3.0) + 0.06*clamp(z-3.0,0.0,12.0) + 0.008*max(z-15.0,0.0) : -0.52 + 0.10*max(z,-14.0); }",
                        "float hf(vec2 p){ float t = uTime;",
                        "  return sin(p.x*0.22+t*0.5)*0.10 + sin(p.y*0.31-t*0.9)*0.14 + sin((p.x*0.6+p.y*0.8)*0.4-t*1.2)*0.07",
                        "       + sin(p.x*1.7+p.y*1.1+t*1.3)*0.030 + sin(p.x*2.3-p.y*2.9-t*1.7)*0.020 + sin(p.y*4.1-t*2.3+p.x*0.7)*0.012; }",
                        "void main(){",
                        "  vec2 p = vWorld.xz; float e = 0.06;",
                        "  float h0 = hf(p), hx = hf(p + vec2(e, 0.0)), hz = hf(p + vec2(0.0, e));",
                        "  vec3 toCam = cameraPosition - vWorld; float camD = length(toCam); vec3 v = toCam / camD;",
                        "  float soft = mix(1.6, 0.3, smoothstep(40.0, 220.0, camD));",
                        "  vec3 n = normalize(vec3((h0 - hx) / e * soft, 1.0, (h0 - hz) / e * soft));",
                        "  float ndv = max(dot(n, v), 0.0);",
                        "  float F = 0.02 + 0.98 * pow(1.0 - ndv, 5.0);",
                        "  float d = length(p);",
                        "  float depth = vWorld.y - sandBase(p.y);",
                        "  if (depth <= 0.0) discard;",
                        "  vec3 water = mix(uShallow, uDeep, smoothstep(1.5, 45.0, d));",
                        "  float crest = smoothstep(0.05, 0.32, vH);",
                        "  float sunLum = dot(uSunCol, vec3(0.333));",
                        "  water += uShallow * crest * 0.45 * sunLum;",
                        "  vec3 r = reflect(-v, n); r.y = abs(r.y);",
                        "  vec3 refl = skyBase(normalize(r));",
                        "  vec3 col = mix(water, refl, F);",
                        "  float sv = smoothstep(-0.02, 0.06, uSun.y);",
                        "  float s = max(dot(r, normalize(uSun)), 0.0);",
                        "  col += uSunCol * (pow(s, 1500.0) * 6.0 + pow(s, 150.0) * 0.7 + pow(s, 18.0) * 0.12) * sv;",
                        "  float sm = max(dot(r, normalize(uMoon)), 0.0);",
                        "  col += uMoonCol * (pow(sm, 1200.0) * 6.0 + pow(sm, 120.0) * 0.8 + pow(sm, 14.0) * 0.15);",
                        "  float g = sin(vWorld.x*3.7+uTime*1.3) * sin(vWorld.z*4.9-uTime*1.9) * sin((vWorld.x-vWorld.z)*6.1+uTime*2.3);",
                        "  col += vec3(0.5, 0.62, 1.0) * uStars * smoothstep(0.7, 0.9, g) * 0.22 * F;",
                        /* foam */
                        "  float nf = vn(p * 2.2 + uTime * 0.15) * 0.6 + vn(p * 5.1 - uTime * 0.2) * 0.4;",
                        "  float wv = sin(p.y*0.31 - uTime*0.9 + sin(p.x*0.2)*0.8);",
                        "  float broken = sin(p.x*0.9+uTime*0.2)*sin(p.y*0.7) + 0.5*sin(p.x*2.3-p.y*1.7);",
                        "  float foamA = smoothstep(0.9, 0.95, wv) * smoothstep(-0.25, 0.2, broken) * smoothstep(0.3, 0.6, nf);",
                        "  float wv2 = sin((p.x*0.6+p.y*0.8)*0.4 - uTime*1.2);",
                        "  float foamB = smoothstep(0.92, 0.96, wv2) * smoothstep(0.0, 0.5, sin(p.x*1.9+p.y*1.3)) * smoothstep(0.3, 0.6, nf);",
                        "  float foam = max(foamA, foamB * 0.8);",
                        "  float rr = length(p);",
                        "  float x = fract(rr * 0.9 - uTime * 0.25);",
                        "  float ring = (1.0 - smoothstep(0.0, 0.06, abs(x - 0.5))) * (1.0 - smoothstep(0.5, 4.5, rr)) * smoothstep(0.35, 0.6, rr);",
                        "  float collar = (1.0 - smoothstep(0.26, 0.42, rr)) * (0.65 + 0.35 * sin(atan(p.y, p.x) * 7.0 + uTime * 1.5));",
                        "  foam = max(foam, max(ring * 0.85, collar));",
                        "  float edge = 1.0 - smoothstep(0.0, 0.17, depth);",
                        "  float lace = edge * (0.45 + 0.55 * vn(p * 7.0 + vec2(uTime * 0.35, 0.0)));",
                        "  foam = max(foam, lace);",
                        "  col = mix(col, uFoam, clamp(foam, 0.0, 1.0) * 0.9);",
                        "  vec3 fogCol = skyBase(normalize(vec3(-v.x, 0.0, -v.z) + vec3(0.0001, 0.0, 0.0)));",
                        "  col = mix(col, fogCol, smoothstep(150.0, 390.0, camD));",
                        "  float alpha = max(smoothstep(0.0, 0.22, depth), edge * 0.75 * smoothstep(0.0, 0.02, depth));",
                        "  gl_FragColor = vec4(col, alpha);",
                        "}",
                    ].join("\n"),
                });
                var oceanGeo = new THREE.PlaneGeometry(800, 800, 400, 400);
                oceanGeo.rotateX(-Math.PI / 2);
                var ocean = new THREE.Mesh(oceanGeo, oceanMat);
                ocean.frustumCulled = false;
                ocean.position.y = -0.49;
                ocean.renderOrder = -9;
                scene.add(ocean);

                /* ================= the beach: sand behind the boy, sea in front, waves washing over his feet ================= */
                function sandBase(z) {
                    if (z >= 0)
                        return (
                            -0.52 +
                            0.16 * Math.min(z, 3) +
                            0.06 * Math.max(0, Math.min(z - 3, 12)) +
                            0.008 * Math.max(z - 15, 0)
                        );
                    return -0.52 + 0.1 * Math.max(z, -14);
                }
                function sandH(x, z) {
                    var h = sandBase(z),
                        u = ss(1.5, 8, z),
                        dn = ss(22, 80, z);
                    h +=
                        u *
                        (0.03 * Math.sin(x * 0.35 + z * 0.21) +
                            0.02 * Math.sin(x * 0.9 - z * 0.4));
                    h +=
                        dn *
                        (1.4 +
                            0.9 * Math.sin(x * 0.021 + 1.0) +
                            0.7 * Math.sin(x * 0.049 + z * 0.031 + 2.0) +
                            0.4 * Math.sin(z * 0.07 + x * 0.013));
                    return h;
                }
                var sandMat = new THREE.ShaderMaterial({
                    uniforms: uni({
                        uHs: { value: new THREE.Color() },
                        uHg: { value: new THREE.Color() },
                        uSunL: { value: new THREE.Color() },
                        uMoonL: { value: new THREE.Color(0x9db6e8) },
                        uHi: { value: 1 },
                        uSunI: { value: 1 },
                        uMoonI: { value: 0 },
                    }),
                    vertexShader:
                        "varying vec3 vWorld, vN; void main(){ vWorld = position; vN = normal; gl_Position = projectionMatrix * viewMatrix * vec4(position, 1.0); }",
                    fragmentShader: [
                        COMMON,
                        NOISE2,
                        "uniform vec3 uHs, uHg, uSunL, uMoonL; uniform float uHi, uSunI, uMoonI; varying vec3 vWorld, vN;",
                        "const float WL = -0.49;",
                        "float wvH(vec2 p, float t){ return sin(p.x*0.22+t*0.5)*0.10 + sin(p.y*0.31-t*0.9)*0.14 + sin((p.x*0.6+p.y*0.8)*0.4-t*1.2)*0.07; }",
                        "float segDist(vec2 p, vec2 a, vec2 b){ vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / max(dot(ba, ba), 0.0001), 0.0, 1.0); return length(pa - ba * h); }",
                        "void main(){",
                        "  vec2 p = vWorld.xz;",
                        "  vec3 toCam = cameraPosition - vWorld; float camD = length(toCam); vec3 v = toCam / camD;",

                    U.uTime.value = wt;

                    if (playing) {
                        curMin = (curMin + dt * 12) % 1440;
                        slider.value = Math.floor(curMin);
                        setHour(curMin);
                    } else if (live && timeLoaded) {
                        liveTick += dt;
                        if (liveTick > 1) {
                            liveTick = 0;
                            curMin = localMinutes();
                            slider.value = Math.floor(curMin);
                            setHour(curMin);
                        }
                    }

                    if (charLoaded && !reduce) {
                        var sway = Math.sin(wt * 0.9);
                        var breathe = Math.sin(wt * 1.4);
                        var look = Math.sin(wt * 0.35);

                        characterPivot.rotation.z = Math.sin(wt * 0.8) * 0.005;
                        characterPivot.rotation.x = Math.sin(wt * 1.1) * 0.003;

                        if (bones["spine003_04"]) {
                            bones["spine003_04"].bone.rotation.x =
                                bones["spine003_04"].baseRot.x +
                                breathe * 0.015;
                        }
                        if (bones["spine005_06"]) {
                            bones["spine005_06"].bone.rotation.x =
                                bones["spine005_06"].baseRot.x +
                                breathe * 0.012;
                        }
                        if (bones["spine006_07"]) {
                            bones["spine006_07"].bone.rotation.y =
                                bones["spine006_07"].baseRot.y + look * 0.07;
                            bones["spine006_07"].bone.rotation.x =
                                bones["spine006_07"].baseRot.x +
                                Math.sin(wt * 0.22) * 0.025;
                        }
                        if (bones["upper_armL_09"]) {
                            bones["upper_armL_09"].bone.rotation.z =
                                bones["upper_armL_09"].baseRot.z + sway * 0.012;
                        }
                        if (bones["upper_armR_032"]) {
                            bones["upper_armR_032"].bone.rotation.z =
                                bones["upper_armR_032"].baseRot.z -
                                sway * 0.012;
                        }
                    }

                    if (!reduce) {
                        clouds.forEach(function (g) {
                            g.position.x += g.userData.speed * dt;
                            if (g.position.x > 340) g.position.x = -340;
                        });
                    }

                    updateCamera(dt, now);
                    camera.updateMatrixWorld();
                    cloudMat.uniforms.uL.value
                        .copy(cloudL)
                        .transformDirection(camera.matrixWorldInverse);
                    cloudMat.uniforms.uSunV.value
                        .copy(sunDir)
                        .transformDirection(camera.matrixWorldInverse);

                    renderer.render(scene, camera);
                    requestAnimationFrame(frame);
                }
                requestAnimationFrame(frame);
            })();
        </script>
    </body>
</html>
